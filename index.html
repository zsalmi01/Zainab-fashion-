<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Royal Elegance Boutique</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#f8e8f1,#ffffff,#efe4ff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:380px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

img{
    width:100%;
    display:block;
}

.content{
    padding:25px;
    text-align:center;
}

h1{
    color:#b51e6b;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    font-size:15px;
    margin-bottom:20px;
}

.price{
    font-size:30px;
    color:#111;
    font-weight:bold;
    margin:15px 0;
}

.description{
    color:#555;
    line-height:1.6;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    background:#c21875;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#9d145f;
}

.contact{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #ddd;
    color:#555;
    line-height:1.8;
}

footer{
    margin-top:20px;
    color:#888;
    font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<img src="IMG-20250708-WA0012_044240~2.jpg" alt="Royal Red Dress">

<div class="content">

<h1>Royal Red Dress</h1>

<p class="subtitle">Luxury Fashion Collection</p>

<div class="price">$150</div>

<p class="description">
Discover timeless elegance with our Royal Red Dress.
Designed with premium craftsmanship for weddings,
evening parties, and unforgettable special occasions.
</p>

<button>Order Now</button>

<div class="contact">
<b>Contact Us</b><br>
Phone: +212 646 575 297
</div>

<footer>
© 2026 Royal Elegance Boutique<br>
Luxury • Style • Elegance
</footer>

</div>

</div>

</body>
</html>
